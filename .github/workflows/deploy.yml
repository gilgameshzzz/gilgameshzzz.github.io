name: Deploy Blog

on:
  push:
    branches: [hexo, master, main, astro-blog]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

defaults:
  run:
    working-directory: astro-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: astro-site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 加密文章只提交密文,CI 不需要密码。
      # 这一步守住两件事:存根正文必须是空的、密文载荷必须在。
      # pre-commit hook 不随仓库分发,所以这里才是真正的防线。
      - name: Assert encrypted posts are sealed
        run: node scripts/assert-sealed.mjs

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
